<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Theme color -->
    <meta name="theme-color" content="#000000" />

    <!-- SEO -->
    <meta
      name="description"
      content="DoCollab — Creator-to-Creator matchmaking network for meaningful collaborations."
    />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Page Title -->
    <title>DoCollab — Collaborate Smarter</title>

    <!-- Smooth UI: preload fonts (optional but recommended) -->
    <link
      rel="preload"
      href="https://fonts.gstatic.com/s/inter/v12/UcCo3FwrK7Eim2BD.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />

    <!-- GOOGLE OAUTH (CORRECTLY PLACED) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Prevent white flash on load -->
    <style>
      body {
        background: #000; /* matches DoCollab theme */
      }
    </style>
  </head>

  <body>
    <noscript>You need JavaScript enabled to run this app.</noscript>

    <div id="root"></div>

    <!-- Optional: Debug helper for Google initialization -->
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        console.log(
          "%cDoCollab client loaded.",
          "color:#7fffd4;font-weight:bold;"
        );
        console.log(
          "Google SDK available? →",
          !!(window.google && window.google.accounts && window.google.accounts.id)
        );
      });
    </script>
  </body>
</html>
